services:

  # =======================================================
  # LARAVEL APP
  # =======================================================

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: locker-app

    restart: unless-stopped

    environment:
      # ---------------------------------------------------
      # APPLICATION
      # ---------------------------------------------------
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}

      APP_LOCALE: ${APP_LOCALE}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE}

      APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER}

      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS}

      # ---------------------------------------------------
      # LOG
      # ---------------------------------------------------
      LOG_CHANNEL: ${LOG_CHANNEL}
      LOG_STACK: ${LOG_STACK}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL}
      LOG_LEVEL: ${LOG_LEVEL}

      # ---------------------------------------------------
      # DATABASE
      # ---------------------------------------------------
      DB_CONNECTION: ${DB_CONNECTION}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      # ---------------------------------------------------
      # SESSION
      # ---------------------------------------------------
      SESSION_DRIVER: ${SESSION_DRIVER}
      SESSION_LIFETIME: ${SESSION_LIFETIME}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT}
      SESSION_PATH: ${SESSION_PATH}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE}
      SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE}

      # ---------------------------------------------------
      # CACHE
      # ---------------------------------------------------
      CACHE_STORE: ${CACHE_STORE}
      CACHE_PREFIX: ${CACHE_PREFIX}

      # ---------------------------------------------------
      # QUEUE
      # ---------------------------------------------------
      QUEUE_CONNECTION: ${QUEUE_CONNECTION}

      # ---------------------------------------------------
      # BROADCAST
      # ---------------------------------------------------
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION}

      # ---------------------------------------------------
      # FILE STORAGE
      # ---------------------------------------------------
      FILESYSTEM_DISK: ${FILESYSTEM_DISK}

      # ---------------------------------------------------
      # SUPABASE S3
      # ---------------------------------------------------
      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT}

      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT}

      # ---------------------------------------------------
      # VITE
      # ---------------------------------------------------
      VITE_APP_NAME: ${VITE_APP_NAME}

    depends_on:
      db:
        condition: service_healthy

    networks:
      - locker-network

    volumes:
      # Laravel writable storage
      - locker-storage:/var/www/html/storage

    expose:
      - "9000"


  # =======================================================
  # NGINX
  # =======================================================

  nginx:
    image: nginx:alpine

    container_name: locker-nginx

    restart: unless-stopped

    depends_on:
      - app

    ports:
      # Hanya bisa diakses dari server sendiri.
      # Nginx utama akan meneruskan domain ke port ini.
      - "127.0.0.1:8088:80"

    volumes:
      # ---------------------------------------------------
      # Laravel project
      # ---------------------------------------------------
      - ./:/var/www/html

      # ---------------------------------------------------
      # Laravel writable storage
      # ---------------------------------------------------
      - locker-storage:/var/www/html/storage

      # ---------------------------------------------------
      # Nginx configuration
      # ---------------------------------------------------
      - ./docker/nginx:/etc/nginx/conf.d:ro

    networks:
      - locker-network


  # =======================================================
  # MYSQL
  # =======================================================

  db:
    image: mysql:8.4

    container_name: locker-db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

    volumes:
      # ---------------------------------------------------
      # DATABASE PERSISTENCE
      # ---------------------------------------------------
      - locker-mysql-data:/var/lib/mysql

    networks:
      - locker-network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u${DB_USERNAME}",
          "-p${DB_PASSWORD}"
        ]

      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


# =========================================================
# NETWORK
# =========================================================

networks:

  locker-network:
    driver: bridge


# =========================================================
# VOLUMES
# =========================================================

volumes:

  # -------------------------------------------------------
  # Laravel storage
  # -------------------------------------------------------
  locker-storage:
    name: locker-storage

  # -------------------------------------------------------
  # MySQL database
  # -------------------------------------------------------
  locker-mysql-data:
    name: locker-mysql-data