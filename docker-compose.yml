services:

  # =======================================================
  # LARAVEL APP
  # =======================================================

  app:
    build:
      context: .
      dockerfile: Dockerfile

      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-Locker}

    container_name: locker-app

    restart: unless-stopped

    env_file:
      - .env

    environment:

      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}

      APP_LOCALE: ${APP_LOCALE:-id}
      APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-id}
      APP_FAKER_LOCALE: ${APP_FAKER_LOCALE:-id_ID}

      APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}

      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}


      # LOG

      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-single}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
      LOG_LEVEL: ${LOG_LEVEL:-error}


      # DATABASE

      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}


      # SESSION

      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
      SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
      SESSION_PATH: ${SESSION_PATH:-/}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY:-true}
      SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}


      # CACHE

      CACHE_STORE: ${CACHE_STORE:-database}
      CACHE_PREFIX: ${CACHE_PREFIX}


      # QUEUE

      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}


      # BROADCAST

      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-log}


      # FILE STORAGE

      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-supabase}


      # SUPABASE

      SUPABASE_S3_ACCESS_KEY_ID: ${SUPABASE_S3_ACCESS_KEY_ID}
      SUPABASE_S3_SECRET_ACCESS_KEY: ${SUPABASE_S3_SECRET_ACCESS_KEY}
      SUPABASE_S3_REGION: ${SUPABASE_S3_REGION:-ap-northeast-2}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET}
      SUPABASE_S3_ENDPOINT: ${SUPABASE_S3_ENDPOINT}

      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-true}


      # VITE

      VITE_APP_NAME: ${VITE_APP_NAME:-Locker}


    depends_on:

      db:
        condition: service_healthy


    volumes:

      - locker-storage:/var/www/html/storage


    networks:

      - locker-network


    expose:

      - "9000"


  # =======================================================
  # NGINX
  # =======================================================

  nginx:
    image: nginx:alpine

    container_name: locker-nginx

    restart: unless-stopped

    depends_on:

      - app


    ports:

      - "127.0.0.1:8088:80"


    volumes:

      # Source Laravel untuk Nginx
      - locker-app-code:/var/www/html:ro

      # Storage
      - locker-storage:/var/www/html/storage

      # Nginx configuration
      - ./docker/nginx:/etc/nginx/conf.d:ro


    networks:

      - locker-network


  # =======================================================
  # MYSQL
  # =======================================================

  db:
    image: mysql:8.4

    container_name: locker-db

    restart: unless-stopped

    environment:

      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}


    volumes:

      - locker-mysql-data:/var/lib/mysql


    networks:

      - locker-network


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"
        ]

      interval: 10s

      timeout: 5s

      retries: 15

      start_period: 30s


# =========================================================
# NETWORK
# =========================================================

networks:

  locker-network:
    name: locker_locker-network
    driver: bridge


# =========================================================
# VOLUMES
# =========================================================

volumes:

  locker-app-code:
    name: locker-app-code

  locker-storage:
    name: locker-storage

  locker-mysql-data:
    name: locker-mysql-data